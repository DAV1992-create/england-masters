<title>England Masters - Match Day</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap');
:root{
  --red:#C8102E;--red-dark:#9a0c22;
  --bg:#0a0a0a;--surface:#141414;--surface2:#1e1e1e;
  --border:#2a2a2a;--border2:#333;
  --white:#ffffff;--off:#cccccc;--muted:#666;
  --green:#00c853;--green-dark:#007a2e;
  --amber:#ff8f00;--blue:#1976d2;--touch:52px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--white);font-family:'Barlow',sans-serif;}
.screen{display:none;position:fixed;inset:0;flex-direction:column;background:var(--bg);}
.screen.active{display:flex;}
#setupScreen{overflow-y:auto;flex-direction:column;}
.setup-header{background:var(--red);padding:14px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.setup-logo{height:34px;background:white;border-radius:6px;padding:2px 5px;}
.setup-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:17px;letter-spacing:0.05em;text-transform:uppercase;color:white;}
.setup-body{padding:14px;max-width:580px;margin:0 auto;width:100%;}
.setup-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;}
.setup-card-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:14px;letter-spacing:0.07em;text-transform:uppercase;color:var(--red);margin-bottom:12px;}
.form-label{display:block;font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.form-group{margin-bottom:11px;}
.form-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:11px 13px;color:var(--white);font-family:'Barlow',sans-serif;font-size:15px;outline:none;-webkit-appearance:none;}
.form-input:focus{border-color:var(--red);}
.form-input::placeholder{color:var(--muted);}
.toggle-group{display:flex;gap:6px;flex-wrap:wrap;}
.toggle-btn{flex:1;min-width:80px;min-height:42px;background:var(--surface2);border:1.5px solid var(--border2);border-radius:8px;color:var(--off);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;transition:all 0.15s;}
.toggle-btn.active{background:var(--red);border-color:var(--red);color:white;}
.start-btn{width:100%;min-height:54px;background:var(--red);border:none;border-radius:12px;color:white;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:900;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;margin-top:6px;}
.opp-field{background:var(--surface2);border:1px solid var(--border2);border-radius:7px;padding:8px 10px;margin-bottom:6px;}
.opp-field-label{font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.opp-field textarea{width:100%;background:transparent;border:none;color:var(--white);font-family:'Barlow',sans-serif;font-size:12px;line-height:1.5;resize:none;outline:none;min-height:44px;}
.opp-field textarea::placeholder{color:var(--muted);}
.formations-list{display:flex;flex-direction:column;gap:6px;}
.formation-item{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.formation-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;}
.formation-meta{font-size:10px;color:var(--muted);margin-top:1px;}
.load-btn{background:var(--red);border:none;border-radius:6px;padding:5px 10px;color:white;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;cursor:pointer;}
.match-topbar{background:var(--surface);border-bottom:1px solid var(--border);height:50px;display:flex;align-items:center;padding:0 10px;gap:6px;flex-shrink:0;z-index:100;}
.tb-btn{background:var(--surface2);border:1px solid var(--border2);border-radius:7px;min-height:36px;padding:0 10px;color:var(--off);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;}
.tb-btn.red{background:var(--red);border-color:var(--red);color:white;}
.score-display{display:flex;align-items:center;gap:8px;margin:0 auto;}
.score-team-name{font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);text-align:center;}
.score-num{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:28px;line-height:1;cursor:pointer;padding:0 4px;}
.score-vs{font-family:'Barlow Condensed',sans-serif;font-size:14px;color:var(--muted);font-weight:700;}
.quarter-tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.q-tab{flex:1;min-height:36px;background:transparent;border:none;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent;transition:all 0.12s;}
.q-tab.active{color:var(--red);border-bottom-color:var(--red);}
.match-body{flex:1;display:flex;overflow:hidden;}
.canvas-panel{flex:1;position:relative;display:flex;flex-direction:column;min-width:0;}
.canvas-toolbar{background:var(--surface);border-bottom:1px solid var(--border);padding:5px 8px;display:flex;align-items:center;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-shrink:0;}
.canvas-toolbar::-webkit-scrollbar{display:none;}
.tool-btn{background:var(--surface2);border:1px solid var(--border2);border-radius:6px;width:32px;height:32px;color:var(--off);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;}
.tool-btn.active{background:var(--red);border-color:var(--red);color:white;}
.color-dot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0;transition:all 0.12s;}
.color-dot.active{border-color:white;transform:scale(1.2);}
.tool-sep{width:1px;height:22px;background:var(--border2);flex-shrink:0;margin:0 2px;}
.pitch-wrap{flex:1;position:relative;overflow:hidden;}
#matchCanvas{display:block;touch-action:none;position:absolute;inset:0;}
.token-tray{background:var(--surface);border-top:1px solid var(--border);padding:5px 8px;display:flex;align-items:center;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-shrink:0;min-height:46px;}
.token-tray::-webkit-scrollbar{display:none;}
.token-chip{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:11px;cursor:pointer;flex-shrink:0;border:2px solid rgba(255,255,255,0.2);color:white;}
.tray-label{font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;}
.side-panel{width:0;background:var(--surface);border-left:1px solid var(--border);overflow:hidden;transition:width 0.25s ease;flex-shrink:0;display:flex;flex-direction:column;}
.side-panel.open{width:280px;}
@media(max-width:700px){.side-panel.open{width:100%;position:absolute;right:0;top:0;bottom:0;z-index:50;}}
.side-panel-header{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.side-panel-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:14px;letter-spacing:0.06em;text-transform:uppercase;}
.side-close{background:var(--surface2);border:none;border-radius:6px;width:28px;height:28px;color:var(--off);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;}
.side-content{flex:1;overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch;}
.side-section{margin-bottom:14px;}
.side-section-title{font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.side-textarea{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;padding:8px 10px;color:var(--white);font-family:'Barlow',sans-serif;font-size:13px;line-height:1.5;resize:none;outline:none;min-height:70px;}
.side-textarea::placeholder{color:var(--muted);}
.save-side-btn{width:100%;min-height:36px;background:var(--green-dark);border:1px solid var(--green);border-radius:7px;color:var(--green);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;letter-spacing:0.07em;text-transform:uppercase;cursor:pointer;margin-top:6px;}
.opp-side-field{background:var(--surface2);border:1px solid var(--border2);border-radius:7px;padding:8px;margin-bottom:6px;}
.opp-side-label{font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
.opp-side-field textarea{width:100%;background:transparent;border:none;color:var(--white);font-family:'Barlow',sans-serif;font-size:12px;line-height:1.5;resize:none;outline:none;min-height:40px;}
.opp-side-field textarea::placeholder{color:var(--muted);}
.voice-btn{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;padding:7px 10px;width:100%;color:var(--off);font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;margin-top:6px;}
.voice-btn.recording{background:rgba(200,16,46,0.2);border-color:var(--red);color:var(--red);}
#timerOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.97);z-index:500;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
#timerOverlay.active{display:flex;}
.timer-label{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);}
.timer-display{font-family:'Barlow Condensed',sans-serif;font-size:88px;font-weight:900;line-height:1;letter-spacing:-2px;color:var(--white);transition:color 0.3s;}
.timer-display.warning{color:var(--amber);}
.timer-display.urgent{color:var(--red);}
.timer-sub{font-size:13px;color:var(--muted);}
.timer-presets{display:flex;gap:8px;}
.timer-preset{padding:6px 14px;border-radius:6px;border:1px solid var(--border2);background:var(--surface2);color:var(--off);cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;}
.timer-preset.active{background:var(--red);border-color:var(--red);color:white;}
.talk-type-label{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;letter-spacing:0.08em;text-transform:uppercase;color:var(--white);background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:7px 18px;}
.timer-btns{display:flex;gap:10px;}
.timer-btn{min-width:90px;min-height:46px;border-radius:10px;border:none;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;letter-spacing:0.07em;text-transform:uppercase;cursor:pointer;}
.timer-btn.go{background:var(--green);color:var(--bg);}
.timer-btn.rst{background:var(--surface2);color:var(--off);border:1px solid var(--border2);}
.timer-btn.cls{background:var(--surface2);color:var(--off);border:1px solid var(--border2);}
#reviewScreen{overflow-y:auto;flex-direction:column;}
.review-header{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.review-body{padding:12px;}
.review-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
.review-card-header{padding:9px 12px;background:var(--surface2);display:flex;align-items:center;justify-content:space-between;}
.review-card-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:13px;letter-spacing:0.05em;text-transform:uppercase;}
.review-card-body{padding:10px 12px;}
.review-snap{width:100%;border-radius:6px;margin-bottom:7px;}
.review-notes{font-size:12px;color:var(--off);line-height:1.6;}
#flagOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:400;align-items:center;justify-content:center;}
#flagOverlay.active{display:flex;}
.flag-card{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:18px;width:250px;text-align:center;}
.flag-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:17px;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px;}
.flag-btns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px;}
.flag-btn{min-height:50px;border-radius:8px;border:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;}
.flag-btn.great{background:rgba(0,200,83,0.2);color:var(--green);border:1.5px solid var(--green);}
.flag-btn.avg{background:rgba(255,143,0,0.2);color:var(--amber);border:1.5px solid var(--amber);}
.flag-btn.poor{background:rgba(200,16,46,0.2);color:var(--red);border:1.5px solid var(--red);}
.flag-btn.sub{background:rgba(25,118,210,0.2);color:var(--blue);border:1.5px solid var(--blue);grid-column:span 2;}
.flag-cancel{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:8px;width:100%;color:var(--muted);cursor:pointer;font-family:'Barlow',sans-serif;font-size:13px;}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);color:white;border:1px solid var(--border2);padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;}
#toast.show{opacity:1;}
#loadingOverlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.4s;}
#loadingOverlay img{height:60px;background:white;border-radius:8px;padding:4px 8px;margin-bottom:14px;}
#loadingOverlay p{color:var(--off);font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;}
#loadingOverlay .spin{width:22px;height:22px;border:2px solid rgba(255,255,255,0.15);border-top-color:var(--red);border-radius:50%;margin-top:12px;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

    <div class="setup-title">Match Day</div>
    <button onclick="window.location.href='dashboard.html'" style="margin-left:auto;background:rgba(255,255,255,0.15);border:none;border-radius:7px;padding:6px 12px;color:white;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:0.06em;text-transform:uppercase;">&#8592; Dashboard</button>
  </div>
  <div class="setup-body">
    <div class="setup-card">
      <div class="setup-card-title">Match Details</div>
      <div class="form-group"><label class="form-label">Opposition</label><input class="form-input" id="oppName" type="text" placeholder="e.g. Germany Masters" autocorrect="off"></div>
      <div class="form-group"><label class="form-label">Date</label><input class="form-input" id="matchDate" type="date"></div>
      <div class="form-group"><label class="form-label">Venue / Competition</label><input class="form-input" id="matchVenue" type="text" placeholder="e.g. Lee Valley"></div>
    </div>
    <div class="setup-card">
      <div class="setup-card-title">Pitch Type</div>
      <div class="toggle-group" id="pitchTypeGroup">
        <button class="toggle-btn active" onclick="setPitchType('outdoor',this)">Outdoor 11v11</button>
        <button class="toggle-btn" onclick="setPitchType('indoor',this)">Indoor</button>
      </div>
      <div style="height:8px"></div>
      <div class="toggle-group" id="playerCountGroup">
        <button class="toggle-btn active" onclick="setPlayerCount(11,this)">11-a-side</button>
        <button class="toggle-btn" onclick="setPlayerCount(6,this)">6-a-side</button>
        <button class="toggle-btn" onclick="setPlayerCount(5,this)">5-a-side</button>
      </div>
    </div>
    <div class="setup-card">
      <div class="setup-card-title">Pre-Match Opposition Notes</div>
      <div class="opp-field"><div class="opp-field-label">Key Players</div><textarea id="pre-keyplayers" placeholder="Danger players to watch..."></textarea></div>
      <div class="opp-field"><div class="opp-field-label">Their Press Shape</div><textarea id="pre-press" placeholder="High press? Mid-block?"></textarea></div>
      <div class="opp-field"><div class="opp-field-label">Set Pieces / PC Threat</div><textarea id="pre-setpieces" placeholder="Notable patterns..."></textarea></div>
      <div class="opp-field"><div class="opp-field-label">Weaknesses</div><textarea id="pre-weaknesses" placeholder="Areas we can target..."></textarea></div>
    </div>
    <div class="setup-card">
      <div class="setup-card-title">Load Formation</div>
      <div class="formations-list" id="setupFormationsList"><div style="font-size:12px;color:var(--muted)">Loading...</div></div>
    </div>
    <button class="start-btn" onclick="startMatch()">&#9654; Start Match Day</button>
    <div style="height:20px"></div>
  </div>
</div>

<!-- MATCH SCREEN -->
<div class="screen" id="matchScreen">
  <div class="match-topbar">
    <button class="tb-btn" onclick="showScreen('setupScreen')">&#8592;</button>
    <button class="tb-btn" id="pitchTypeBtn" onclick="togglePitch()">&#127944; Out</button>
    <button class="tb-btn red" onclick="openTimer('half')">&#9201; Talk</button>
    <div class="score-display">
      <div><div class="score-team-name">ENG</div><div class="score-num" id="ourScore" onclick="changeScore('our',1)">0</div></div>
      <div class="score-vs">-</div>
      <div><div class="score-num" id="oppScore" onclick="changeScore('opp',1)">0</div><div class="score-team-name" id="oppNameDisplay">OPP</div></div>
    </div>
    <button class="tb-btn" onclick="togglePanel('notes')">&#128203;</button>
    <button class="tb-btn" onclick="togglePanel('opp')">&#128269;</button>
    <button class="tb-btn" onclick="showReview()">&#9654; Review</button>
  </div>
  <div class="quarter-tabs">
    <button class="q-tab active" id="qt-1" onclick="switchQuarter(1)">Q1</button>
    <button class="q-tab" id="qt-2" onclick="switchQuarter(2)">Q2</button>
    <button class="q-tab" id="qt-3" onclick="switchQuarter(3)">Q3</button>
    <button class="q-tab" id="qt-4" onclick="switchQuarter(4)">Q4</button>
  </div>
  <div class="match-body">
    <div class="canvas-panel">
      <div class="canvas-toolbar">
        <button class="tool-btn active" id="t-select" onclick="setTool('select')" title="Select">&#8598;</button>
        <button class="tool-btn" id="t-arrow" onclick="setTool('arrow')" title="Arrow">&#8594;</button>
        <button class="tool-btn" id="t-dasharrow" onclick="setTool('dasharrow')" title="Dashed">&#8674;</button>
        <button class="tool-btn" id="t-line" onclick="setTool('line')" title="Line">&#9585;</button>
        <button class="tool-btn" id="t-zone" onclick="setTool('zone')" title="Zone">&#9645;</button>
        <div class="tool-sep"></div>
        <div class="color-dot active" style="background:#ffffff" onclick="setColor('#ffffff')"></div>
        <div class="color-dot" style="background:#ffeb3b" onclick="setColor('#ffeb3b')"></div>
        <div class="color-dot" style="background:#f44336" onclick="setColor('#f44336')"></div>
        <div class="color-dot" style="background:#4caf50" onclick="setColor('#4caf50')"></div>
        <div class="color-dot" style="background:#2196f3" onclick="setColor('#2196f3')"></div>
        <div class="color-dot" style="background:#ff9800" onclick="setColor('#ff9800')"></div>
        <div class="tool-sep"></div>
        <button class="tool-btn" onclick="undoLive()" title="Undo">&#8617;</button>
        <button class="tool-btn" style="color:var(--amber)" onclick="clearLive()">&#10005;</button>
        <button class="tool-btn" style="color:var(--green);margin-left:auto" onclick="saveSnap()">&#128190;</button>
      </div>
      <div class="pitch-wrap"><canvas id="matchCanvas"></canvas></div>
      <div class="token-tray" id="tokenTray"><span class="tray-label">Tap to add:</span></div>
    </div>
    <div class="side-panel" id="sidePanel">
      <div class="side-panel-header">
        <div class="side-panel-title" id="sidePanelTitle">Notes</div>
        <button class="side-close" onclick="closePanel()">&#10005;</button>
      </div>
      <div class="side-content" id="sidePanelContent"></div>
    </div>
  </div>
</div>

<!-- REVIEW SCREEN -->
<div class="screen" id="reviewScreen">

function resizeCanvas() {

function drawPitch() {
  if (!ctx || !canvas.width || !canvas.height) return;
  if (matchData.pitchType === 'indoor') drawIndoorPitch(canvas.width, canvas.height);
  else drawOutdoorPitch(canvas.width, canvas.height);
}

function drawOutdoorPitch(w, h) {
  // Field hockey outdoor pitch - landscape orientation
  // Correct features: D (shooting circle), 23m lines, centre circle, penalty spots, goals
  ctx.fillStyle = '#1a5c1a';
  ctx.fillRect(0, 0, w, h);
  // Pitch stripes
  for (var i = 0; i < 8; i++) {
    ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.06)';
    ctx.fillRect(i * w / 8, 0, w / 8, h);
  }
  var lc = 'rgba(255,255,255,0.85)';
  ctx.strokeStyle = lc; ctx.lineWidth = 2;
  var px = w * 0.04, py = h * 0.05, pw = w * 0.92, ph = h * 0.90;
  // Outer boundary
  ctx.strokeRect(px, py, pw, ph);
  // Centre line (divides pitch left/right since landscape)
  ctx.beginPath(); ctx.moveTo(px + pw/2, py); ctx.lineTo(px + pw/2, py + ph); ctx.stroke();
  // Centre circle
  ctx.beginPath(); ctx.arc(px + pw/2, py + ph/2, ph * 0.15, 0, Math.PI * 2); ctx.stroke();
  // Centre spot
  ctx.fillStyle = lc;
  ctx.beginPath(); ctx.arc(px + pw/2, py + ph/2, 4, 0, Math.PI * 2); ctx.fill();
  // 23m lines (field hockey specific - 25% from each end)
  ctx.strokeStyle = lc;
  ctx.beginPath(); ctx.moveTo(px + pw*0.25, py); ctx.lineTo(px + pw*0.25, py + ph); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(px + pw*0.75, py); ctx.lineTo(px + pw*0.75, py + ph); ctx.stroke();
  // Shooting circles (the D) - field hockey NOT football
  // Left D: arc at left end
  ctx.beginPath();
  ctx.arc(px, py + ph/2, ph * 0.32, -Math.PI * 0.52, Math.PI * 0.52);
  ctx.stroke();
  // Right D: arc at right end
  ctx.beginPath();
  ctx.arc(px + pw, py + ph/2, ph * 0.32, Math.PI * 0.48, Math.PI * 1.52);
  ctx.stroke();
  // Goals (small rectangles protruding from end lines)
  var gw = ph * 0.18;
  var gd = pw * 0.018;
  // Left goal
  ctx.beginPath();
  ctx.moveTo(px, py + ph/2 - gw/2);
  ctx.lineTo(px - gd, py + ph/2 - gw/2);
  ctx.lineTo(px - gd, py + ph/2 + gw/2);
  ctx.lineTo(px, py + ph/2 + gw/2);
  ctx.stroke();
  // Right goal
  ctx.beginPath();
  ctx.moveTo(px + pw, py + ph/2 - gw/2);
  ctx.lineTo(px + pw + gd, py + ph/2 - gw/2);
  ctx.lineTo(px + pw + gd, py + ph/2 + gw/2);
  ctx.lineTo(px + pw, py + ph/2 + gw/2);
  ctx.stroke();
  // 5m goal areas (small box inside D)
  var ga = ph * 0.1;
  ctx.strokeRect(px, py + ph/2 - ga/2, pw * 0.04, ga);
  ctx.strokeRect(px + pw - pw*0.04, py + ph/2 - ga/2, pw * 0.04, ga);
  // Penalty spots (6.4m from goal line)
  ctx.fillStyle = lc;
  ctx.beginPath(); ctx.arc(px + pw*0.07, py + ph/2, 4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(px + pw*0.93, py + ph/2, 4, 0, Math.PI*2); ctx.fill();
  // End labels
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.font = 'bold ' + Math.max(9, w*0.012) + 'px Barlow Condensed,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText('ATTACKING', px + pw*0.87, py + ph - 4);
  ctx.fillText('DEFENDING', px + pw*0.13, py + ph - 4);
}

function drawIndoorPitch(w, h) {
  // Field hockey indoor pitch (landscape)
  ctx.fillStyle = '#1a3a6b';
  ctx.fillRect(0, 0, w, h);
  for (var i = 0; i < 8; i++) {
    ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.05)';
    ctx.fillRect(i * w / 8, 0, w / 8, h);
  }
  var lc = 'rgba(255,255,255,0.9)';
  ctx.strokeStyle = lc; ctx.lineWidth = 2;
  var px = w*0.03, py = h*0.05, pw = w*0.94, ph = h*0.90;
  // Boards area (side panels)
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  ctx.fillRect(0, 0, px, h); ctx.fillRect(px + pw, 0, w - px - pw, h);
  // Outer boundary
  ctx.strokeRect(px, py, pw, ph);
  // Centre line
  ctx.beginPath(); ctx.moveTo(px + pw/2, py); ctx.lineTo(px + pw/2, py + ph); ctx.stroke();
  // Centre circle (smaller for indoor)
  ctx.beginPath(); ctx.arc(px + pw/2, py + ph/2, ph * 0.18, 0, Math.PI * 2); ctx.stroke();
  // Centre spot
  ctx.fillStyle = lc;
  ctx.beginPath(); ctx.arc(px + pw/2, py + ph/2, 4, 0, Math.PI * 2); ctx.fill();
  // Shooting circles (D arcs for indoor)
  ctx.beginPath(); ctx.arc(px, py + ph/2, ph * 0.36, -Math.PI * 0.47, Math.PI * 0.47); ctx.stroke();
  ctx.beginPath(); ctx.arc(px + pw, py + ph/2, ph * 0.36, Math.PI * 0.53, Math.PI * 1.47); ctx.stroke();
  // Goals (wider for indoor relative to pitch size)
  var gw = ph * 0.26;
  var gd = pw * 0.025;
  ctx.beginPath();
  ctx.moveTo(px, py + ph/2 - gw/2);
  ctx.lineTo(px - gd, py + ph/2 - gw/2);
  ctx.lineTo(px - gd, py + ph/2 + gw/2);
  ctx.lineTo(px, py + ph/2 + gw/2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(px + pw, py + ph/2 - gw/2);
  ctx.lineTo(px + pw + gd, py + ph/2 - gw/2);
  ctx.lineTo(px + pw + gd, py + ph/2 + gw/2);
  ctx.lineTo(px + pw, py + ph/2 + gw/2);
  ctx.stroke();
  // Penalty spots
  ctx.fillStyle = lc;
  ctx.beginPath(); ctx.arc(px + pw*0.09, py + ph/2, 4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(px + pw*0.91, py + ph/2, 4, 0, Math.PI*2); ctx.fill();
  // Labels
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.font = 'bold ' + Math.max(8, w*0.011) + 'px Barlow Condensed,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('BOARD', px/2, h/2); ctx.fillText('BOARD', px + pw + (w - px - pw)/2, h/2);
  ctx.textBaseline = 'bottom';
  ctx.fillText('INDOOR FIELD HOCKEY', px + pw/2, py + ph - 4);
}

function redrawAll() {
  drawPitch();
  qData[currentQuarter].elements.forEach(function(el){ drawElement(el); });
  qData[currentQuarter].live.forEach(function(el){ drawElement(el, true); });
}

function drawElement(el, isLive) {
  if (!ctx) return;
  ctx.save();
  if (el.type === 'player') {
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 6;
    ctx.fillStyle = el.color || '#1565c0';
    ctx.beginPath(); ctx.arc(el.x, el.y, 18, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2; ctx.stroke();
    var flag = qData[currentQuarter].flags[el.id];
    if (flag) {
      var fc = { great:'#00c853', avg:'#ff8f00', poor:'#c62828', sub:'#1976d2' }[flag] || 'white';
      ctx.fillStyle = fc; ctx.beginPath(); ctx.arc(el.x + 13, el.y - 13, 6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = 'white';
    ctx.font = '900 ' + (el.num && el.num.length > 2 ? '10' : '12') + 'px Barlow Condensed,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(el.num || '', el.x, el.y);
  } else if (el.type === 'arrow' || el.type === 'dasharrow') {
    ctx.strokeStyle = el.color || '#fff'; ctx.lineWidth = 2.5;
    ctx.setLineDash(el.type === 'dasharrow' ? [10, 6] : []);
    ctx.beginPath(); ctx.moveTo(el.x1, el.y1); ctx.lineTo(el.x2, el.y2); ctx.stroke();
    ctx.setLineDash([]);
    var angle = Math.atan2(el.y2 - el.y1, el.x2 - el.x1);
    ctx.fillStyle = el.color || '#fff'; ctx.beginPath();
    ctx.moveTo(el.x2, el.y2);
    ctx.lineTo(el.x2 - 15*Math.cos(angle-0.4), el.y2 - 15*Math.sin(angle-0.4));
    ctx.lineTo(el.x2 - 15*Math.cos(angle+0.4), el.y2 - 15*Math.sin(angle+0.4));
    ctx.closePath(); ctx.fill();
  } else if (el.type === 'line') {
    ctx.strokeStyle = el.color || '#fff'; ctx.lineWidth = 2.5;
    ctx.setLineDash([8, 5]);
    ctx.beginPath(); ctx.moveTo(el.x1, el.y1); ctx.lineTo(el.x2, el.y2); ctx.stroke();
    ctx.setLineDash([]);
  } else if (el.type === 'zone') {
    ctx.fillStyle = (el.color || '#fff') + '33';
    ctx.strokeStyle = el.color || '#fff'; ctx.lineWidth = 2;
    ctx.fillRect(el.x, el.y, el.w, el.h); ctx.strokeRect(el.x, el.y, el.w, el.h);
  }
  ctx.restore();
}

function setupCanvasEvents() {
  canvas.addEventListener('mousedown', onStart);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseup', onEnd);
  canvas.addEventListener('touchstart', function(e){ e.preventDefault(); onStart(touchEvt(e)); }, { passive:false });
  canvas.addEventListener('touchmove', function(e){ e.preventDefault(); onMove(touchEvt(e)); }, { passive:false });
  canvas.addEventListener('touchend', function(e){ e.preventDefault(); onEnd(touchEvt(e)); }, { passive:false });
}

function touchEvt(e) {
  var rect = canvas.getBoundingClientRect();
  var t = e.touches[0] || e.changedTouches[0];
  return { offsetX: t.clientX - rect.left, offsetY: t.clientY - rect.top };
}

function onStart(e) {
  var x = e.offsetX, y = e.offsetY;
  dragStartX = x; dragStartY = y;
  if (activeTool === 'select') {
    var all = qData[currentQuarter].elements.concat(qData[currentQuarter].live);
    for (var i = all.length - 1; i >= 0; i--) {
      var el = all[i];
      if (el.type === 'player' && Math.sqrt((x-el.x)**2 + (y-el.y)**2) < 22) {
        dragging = el; dragOffX = x - el.x; dragOffY = y - el.y; return;
      }
    }
    return;
  }
  isDrawing = true; startX = x; startY = y;
}

function onMove(e) {
  var x = e.offsetX, y = e.offsetY;
  if (dragging) { dragging.x = x - dragOffX; dragging.y = y - dragOffY; redrawAll(); return; }
  if (!isDrawing) return;
  if (activeTool === 'arrow' || activeTool === 'dasharrow' || activeTool === 'line' || activeTool === 'zone') {
    redrawAll();
    ctx.save(); ctx.strokeStyle = activeColor; ctx.lineWidth = 2.5;
    if (activeTool === 'zone') {
      ctx.fillStyle = activeColor + '33';
      ctx.fillRect(startX, startY, x-startX, y-startY); ctx.strokeRect(startX, startY, x-startX, y-startY);
    } else {
      ctx.setLineDash(activeTool === 'dasharrow' ? [10,6] : activeTool === 'line' ? [8,5] : []);
      ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(x, y); ctx.stroke(); ctx.setLineDash([]);
      if (activeTool === 'arrow' || activeTool === 'dasharrow') {
        var angle = Math.atan2(y-startY, x-startX);
        ctx.fillStyle = activeColor; ctx.beginPath(); ctx.moveTo(x, y);
        ctx.lineTo(x-15*Math.cos(angle-0.4), y-15*Math.sin(angle-0.4));
        ctx.lineTo(x-15*Math.cos(angle+0.4), y-15*Math.sin(angle+0.4));
        ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();
  }
}

function onEnd(e) {
  var x = e.offsetX, y = e.offsetY;
  if (dragging) {
    var moved = Math.abs(x-dragStartX) > 8 || Math.abs(y-dragStartY) > 8;
    if (!moved) openFlagOverlay(dragging);
    dragging = null; redrawAll(); return;
  }
  if (!isDrawing) return; isDrawing = false;
  var live = qData[currentQuarter].live;
  if (activeTool === 'arrow') live.push({ type:'arrow', x1:startX, y1:startY, x2:x, y2:y, color:activeColor });
  else if (activeTool === 'dasharrow') live.push({ type:'dasharrow', x1:startX, y1:startY, x2:x, y2:y, color:activeColor });
  else if (activeTool === 'line') live.push({ type:'line', x1:startX, y1:startY, x2:x, y2:y, color:activeColor });
  else if (activeTool === 'zone') live.push({ type:'zone', x:startX, y:startY, w:x-startX, h:y-startY, color:activeColor });
  redrawAll();
}

function setTool(t) {
  activeTool = t;
  document.querySelectorAll('.tool-btn').forEach(function(b){ b.classList.remove('active'); });
  var btn = document.getElementById('t-' + t); if (btn) btn.classList.add('active');
}
function setColor(c) {
  activeColor = c;
  document.querySelectorAll('.color-dot').forEach(function(b){
    b.classList.toggle('active', b.style.background === c || b.style.backgroundColor === c);
  });
}
function undoLive() { qData[currentQuarter].live.pop(); redrawAll(); }
function clearLive() { qData[currentQuarter].live = []; redrawAll(); showToast('Live drawings cleared'); }

function buildTokenTray() {
  var tray = document.getElementById('tokenTray');
  var n = matchData.playerCount;
  var tokens = n === 11 ? [
    {num:'GK',color:'#e65100'},{num:'2',color:'#1565c0'},{num:'3',color:'#1565c0'},{num:'4',color:'#1565c0'},
    {num:'5',color:'#1565c0'},{num:'6',color:'#2e7d32'},{num:'7',color:'#2e7d32'},{num:'8',color:'#2e7d32'},
    {num:'9',color:'#C8102E'},{num:'10',color:'#C8102E'},{num:'11',color:'#C8102E'}
  ] : n === 6 ? [
    {num:'GK',color:'#e65100'},{num:'2',color:'#1565c0'},{num:'3',color:'#1565c0'},
    {num:'4',color:'#2e7d32'},{num:'5',color:'#C8102E'},{num:'6',color:'#C8102E'}
  ] : [
    {num:'GK',color:'#e65100'},{num:'2',color:'#1565c0'},{num:'3',color:'#1565c0'},
    {num:'4',color:'#2e7d32'},{num:'5',color:'#C8102E'}
  ];
  var chips = tokens.map(function(t){ return '<div class="token-chip" style="background:' + t.color + '" onclick="addToken(\'' + t.num + '\',\'' + t.color + '\')"> ' + t.num + '</div>'; }).join('');
  var opp = tokens.map(function(t){ return '<div class="token-chip" style="background:#555;border-color:rgba(255,255,255,0.3)" onclick="addOppToken(\'' + t.num + '\')">' + t.num + '</div>'; }).join('');
  tray.innerHTML = '<span class="tray-label">Us:</span>' + chips + '<div style="width:1px;height:22px;background:var(--border2);flex-shrink:0;margin:0 4px"></div><span class="tray-label">Opp:</span>' + opp;
}

function addToken(num, color) {
  var id = 't' + Date.now() + Math.random();
  qData[currentQuarter].elements.push({ type:'player', x:canvas.width/2+(Math.random()-0.5)*80, y:canvas.height/2+(Math.random()-0.5)*60, num:num, color:color, id:id });
  redrawAll();
}
function addOppToken(num) {
  var id = 'o' + Date.now() + Math.random();
  qData[currentQuarter].elements.push({ type:'player', x:canvas.width*0.25+(Math.random()-0.5)*60, y:canvas.height/2+(Math.random()-0.5)*60, num:num, color:'#555', id:id, isOpp:true });
  redrawAll();
}

function openFlagOverlay(token) {
  flagToken = token;
  document.getElementById('flagPlayerName').textContent = '#' + token.num;
  document.getElementById('flagOverlay').classList.add('active');
}
function setFlag(type) {
  if (!flagToken) return;
  if (type === 'sub') {
    var inn = prompt('Sub: #' + flagToken.num + ' OFF. Who is coming ON?');
    if (inn) { qData[currentQuarter].subs.push({ out:flagToken.num, inn:inn, time:new Date().toLocaleTimeString() }); flagToken.num = inn; showToast('Sub logged'); }
  } else { qData[currentQuarter].flags[flagToken.id] = type; showToast('#' + flagToken.num + ' flagged'); }
  document.getElementById('flagOverlay').classList.remove('active');
  flagToken = null; redrawAll();
}

function changeScore(team, delta) {
  if (team === 'our') { matchData.ourScore = Math.max(0, matchData.ourScore + delta); document.getElementById('ourScore').textContent = matchData.ourScore; }
  else { matchData.oppScore = Math.max(0, matchData.oppScore + delta); document.getElementById('oppScore').textContent = matchData.oppScore; }
}

function switchQuarter(q) {
  autoSave();
  currentQuarter = q;
  document.querySelectorAll('.q-tab').forEach(function(b, i){ b.classList.toggle('active', i+1 === q); });
  redrawAll(); showToast('Quarter ' + q);
}

async function autoSave() {
  if (!matchData.matchId || !canvas.width) return;
  try {
    var snap = canvas.toDataURL('image/jpeg', 0.65);
    var blob = await (await fetch(snap)).blob();
    var fname = 'match_' + matchData.matchId + '_q' + currentQuarter + '_' + Date.now() + '.jpg';
    var r = await fetch(SB_URL + '/storage/v1/object/tactics-media/' + fname, {
      method:'POST', headers:{ apikey:SB_KEY, Authorization:'Bearer ' + session.access_token, 'Content-Type':'image/jpeg', 'Cache-Control':'600' }, body:blob
    });
    var snapUrl = r.ok ? STORAGE + '/tactics-media/' + fname : null;
    var qd = qData[currentQuarter];
    await fetch(SB_URL + '/rest/v1/match_quarters', {
      method:'POST',
      headers: Object.assign({}, hdrs(session.access_token), { Prefer:'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify({ match_id:matchData.matchId, quarter:currentQuarter, board_data:{ elements:qd.elements, live:qd.live, snapUrl:snapUrl }, coach_notes:qd.notes, player_flags:qd.flags, our_score:matchData.ourScore, opp_score:matchData.oppScore })
    });
  } catch(e) {}
}
async function saveSnap() { await autoSave(); showToast('Q' + currentQuarter + ' saved'); }

function openTimer(type) {
  var labels = { pre:'Pre-Match Talk', half:'Half Time Talk', quarter:'Quarter Time', post:'Post-Match' };
  document.getElementById('timerTalkType').textContent = labels[type] || 'Team Talk';
  document.getElementById('timerMatchInfo').textContent = (matchData.oppName || 'Match') + ' - Q' + currentQuarter;
  var defaultTime = type === 'quarter' ? 120 : type === 'pre' || type === 'post' ? 300 : 600;
  setTimerPreset(defaultTime, null);
  timerRunning = false; timerElapsed = 0;
  document.getElementById('timerStartBtn').textContent = 'Start';
  document.getElementById('timerDisplay').className = 'timer-display';
  document.getElementById('timerOverlay').classList.add('active');
}

function setTimerPreset(secs, btn) {
  timerPreset = secs; timerSecs = secs;
  document.querySelectorAll('.timer-preset').forEach(function(b){ b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  if (timerRunning) { clearInterval(timerInterval); timerRunning = false; document.getElementById('timerStartBtn').textContent = 'Start'; }
  updateTimerDisplay();
}

function toggleTimer() {
  if (timerRunning) {
    clearInterval(timerInterval); timerRunning = false;
    document.getElementById('timerStartBtn').textContent = 'Resume';
  } else {
    timerRunning = true;
    document.getElementById('timerStartBtn').textContent = 'Pause';
    timerInterval = setInterval(function(){
      timerSecs--; timerElapsed++;
      updateTimerDisplay();
      if (timerSecs === 30) { showToast('30 seconds remaining!'); playBeep(440); }
      if (timerSecs <= 0) {
        clearInterval(timerInterval); timerRunning = false;
        document.getElementById('timerStartBtn').textContent = 'Start';
        playBell(); saveTeamTalk();
      }
    }, 1000);
  }
}

function updateTimerDisplay() {
  var abs = Math.abs(timerSecs);
  var m = Math.floor(abs/60), s = abs % 60;
  document.getElementById('timerDisplay').textContent = (timerSecs < 0 ? '-' : '') + m + ':' + String(s).padStart(2,'0');
  document.getElementById('timerDisplay').className = 'timer-display' + (timerSecs <= 0 ? ' urgent' : timerSecs <= 30 ? ' warning' : '');
  var em = Math.floor(timerElapsed/60), es = timerElapsed % 60;
  document.getElementById('timerSub').textContent = 'Elapsed: ' + em + ':' + String(es).padStart(2,'0');
}

function resetTimer() {
  clearInterval(timerInterval); timerRunning = false; timerSecs = timerPreset; timerElapsed = 0;
  updateTimerDisplay(); document.getElementById('timerDisplay').className = 'timer-display';
  document.getElementById('timerStartBtn').textContent = 'Start';
}
function closeTimer() { clearInterval(timerInterval); timerRunning = false; document.getElementById('timerOverlay').classList.remove('active'); saveTeamTalk(); }

async function saveTeamTalk() {
  if (!matchData.matchId) return;
  try {
    var snap = canvas.width ? canvas.toDataURL('image/jpeg', 0.6) : null;
    var snapUrl = null;
    if (snap) {
      var blob = await (await fetch(snap)).blob();
      var fname = 'talk_' + matchData.matchId + '_q' + currentQuarter + '_' + Date.now() + '.jpg';
      var r = await fetch(SB_URL + '/storage/v1/object/tactics-media/' + fname, {
        method:'POST', headers:{ apikey:SB_KEY, Authorization:'Bearer ' + session.access_token, 'Content-Type':'image/jpeg' }, body:blob
      });
      if (r.ok) snapUrl = STORAGE + '/tactics-media/' + fname;
    }
    var qd = qData[currentQuarter];
    await fetch(SB_URL + '/rest/v1/team_talks', {
      method:'POST', headers: Object.assign({}, hdrs(session.access_token), { Prefer:'return=minimal' }),
      body: JSON.stringify({ match_id:matchData.matchId, quarter:currentQuarter, talk_type:'half', board_data:{ elements:qd.elements, live:qd.live, snapUrl:snapUrl }, notes:qd.notes, duration_secs:timerElapsed })
    });
    teamTalks.push({ quarter:currentQuarter, snapUrl:snapUrl, notes:qd.notes, duration:timerElapsed, time:new Date().toISOString() });
  } catch(e) {}
}

function playBeep(freq) {
  try {
    var a = new (window.AudioContext || window.webkitAudioContext)();
    var o = a.createOscillator(); var g = a.createGain();
    o.connect(g); g.connect(a.destination);
    o.frequency.value = freq; g.gain.setValueAtTime(0.3, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, a.currentTime + 0.3);
    o.start(); o.stop(a.currentTime + 0.3);
  } catch(e) {}
}
function playBell() { [0, 200, 400].forEach(function(t){ setTimeout(function(){ playBeep(880); }, t); }); }

function togglePanel(name) {
  if (currentPanel === name) { closePanel(); return; }
  currentPanel = name;
  document.getElementById('sidePanel').classList.add('open');
  if (name === 'notes') renderNotesPanel();
  else if (name === 'opp') renderOppPanel();
}
function closePanel() { currentPanel = null; document.getElementById('sidePanel').classList.remove('open'); }

function renderNotesPanel() {
  document.getElementById('sidePanelTitle').textContent = 'Q' + currentQuarter + ' Notes';
  var qd = qData[currentQuarter];
  document.getElementById('sidePanelContent').innerHTML =
    '<div class="side-section"><div class="side-section-title">Coach Notes</div>' +
    '<textarea class="side-textarea" id="qNotes" placeholder="Notes for Q' + currentQuarter + '..." rows="6">' + (qd.notes || '') + '</textarea>' +
    '<button class="save-side-btn" onclick="saveNotes()">Save Notes</button></div>' +
    '<div class="side-section" style="margin-top:12px"><div class="side-section-title">Player Flags</div>' + renderFlagSummary() + '</div>' +
    '<div class="side-section" style="margin-top:12px"><div class="side-section-title">Substitutions</div>' + renderSubLog() + '</div>';
}
function renderFlagSummary() {
  var flags = qData[currentQuarter].flags;
  if (!Object.keys(flags).length) return '<div style="font-size:12px;color:var(--muted)">No flags yet. Tap a player token.</div>';
  var icons = { great:'&#129001;', avg:'&#128993;', poor:'&#128308;', sub:'&#128260;' };
  return Object.entries(flags).map(function(e){ return '<div style="font-size:12px;margin-bottom:4px">' + (icons[e[1]] || '') + ' ' + e[0] + ' - ' + e[1] + '</div>'; }).join('');
}
function renderSubLog() {
  var subs = qData[currentQuarter].subs;
  if (!subs.length) return '<div style="font-size:12px;color:var(--muted)">No substitutions.</div>';
  return subs.map(function(s){ return '<div style="font-size:12px;margin-bottom:4px">Sub: #' + s.out + ' off, ' + s.inn + ' on (' + s.time + ')</div>'; }).join('');
}
function saveNotes() { qData[currentQuarter].notes = document.getElementById('qNotes').value; showToast('Notes saved'); }

function renderOppPanel() {
  document.getElementById('sidePanelTitle').textContent = 'Opposition';
  var on = qData[currentQuarter].oppNotes;
  document.getElementById('sidePanelContent').innerHTML =
    '<div style="font-size:9px;color:var(--muted);font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px">Q' + currentQuarter + ' Live Notes</div>' +
    '<div class="opp-side-field"><div class="opp-side-label">Key Threats</div><textarea placeholder="Who is dangerous?" id="on-threats" oninput="saveOppNotes()">' + (on.threats||'') + '</textarea></div>' +
    '<div class="opp-side-field"><div class="opp-side-label">Their Press</div><textarea placeholder="How are they pressing?" id="on-press" oninput="saveOppNotes()">' + (on.press||'') + '</textarea></div>' +
    '<div class="opp-side-field"><div class="opp-side-label">Set Pieces</div><textarea placeholder="PC patterns..." id="on-setpiece" oninput="saveOppNotes()">' + (on.setpiece||'') + '</textarea></div>' +
    '<div class="opp-side-field"><div class="opp-side-label">Adjustments</div><textarea placeholder="What do we need to change?" id="on-adjust" oninput="saveOppNotes()">' + (on.adjust||'') + '</textarea></div>' +
    '<button class="voice-btn" id="voiceBtn" onclick="toggleVoice()">&#127908; Record Voice Note</button>' +
    (on.voiceUrl ? '<audio controls src="' + on.voiceUrl + '" style="width:100%;margin-top:8px;border-radius:6px"></audio>' : '');
}
function saveOppNotes() {
  var on = qData[currentQuarter].oppNotes;
  ['threats','press','setpiece','adjust'].forEach(function(k){ var el = document.getElementById('on-'+k); if (el) on[k] = el.value; });
}

async function toggleVoice() {
  var btn = document.getElementById('voiceBtn');
  if (!isRecording) {
    try {
      var stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      mediaRecorder = new MediaRecorder(stream); audioChunks = [];
      mediaRecorder.ondataavailable = function(e){ audioChunks.push(e.data); };
      mediaRecorder.onstop = async function() {
        var blob = new Blob(audioChunks, { type:'audio/webm' });
        var fname = 'voice_' + Date.now() + '.webm';
        try {
          var r = await fetch(SB_URL + '/storage/v1/object/tactics-media/' + fname, {
            method:'POST', headers:{ apikey:SB_KEY, Authorization:'Bearer ' + session.access_token, 'Content-Type':'audio/webm' }, body:blob
          });
          if (r.ok) { qData[currentQuarter].oppNotes.voiceUrl = STORAGE + '/tactics-media/' + fname; showToast('Voice note saved'); renderOppPanel(); }
        } catch(e) { showToast('Could not save voice note'); }
      };
      mediaRecorder.start(); isRecording = true;
      btn.textContent = 'Stop Recording'; btn.classList.add('recording');
    } catch(e) { showToast('Microphone access denied'); }
  } else {
    mediaRecorder.stop(); isRecording = false;
    btn.textContent = 'Record Voice Note'; btn.classList.remove('recording');
  }
}

async function showReview() {
  showScreen('reviewScreen');
  var body = document.getElementById('reviewBody');
  body.innerHTML = '<div style="text-align:center;padding:30px;color:var(--muted)">Loading...</div>';
  var talks = [];
  if (matchData.matchId) {
    try {
      var r = await fetch(SB_URL + '/rest/v1/team_talks?match_id=eq.' + matchData.matchId + '&order=created_at&select=*', { headers: hdrs(session.access_token) });
      talks = await r.json();
    } catch(e) {}
  }
  var all = teamTalks.concat(talks.filter(function(t){ return !teamTalks.find(function(l){ return l.quarter === t.quarter; }); }));
  if (!all.length) {
    body.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)"><h3 style="font-family:Barlow Condensed,sans-serif;font-size:18px;color:var(--off);margin-bottom:8px">No team talks yet</h3><p>Talks save automatically when you close the timer.</p></div>';
    return;
  }
  var typeLabels = { pre:'Pre-Match', quarter:'Quarter Time', half:'Half Time', post:'Post-Match' };
  body.innerHTML = all.map(function(t){
    var snap = t.snapUrl || (t.board_data && t.board_data.snapUrl);
    var dur = t.duration_secs || t.duration || 0;
    var m = Math.floor(dur/60), s = dur % 60;
    return '<div class="review-card"><div class="review-card-header"><div class="review-card-title">' + (typeLabels[t.talk_type||t.type]||'Talk') + ' - Q' + t.quarter + '</div><div style="font-size:11px;color:var(--muted)">' + m + 'm ' + s + 's</div></div>' +
      '<div class="review-card-body">' +
      (snap ? '<img class="review-snap" src="' + snap + '" alt="">' : '<div style="height:60px;background:var(--surface2);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;margin-bottom:7px">No snapshot</div>') +
      '<div class="review-notes">' + (t.notes||t.coach_notes||'No notes') + '</div></div></div>';
  }).join('');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  if (id === 'matchScreen') requestAnimationFrame(function(){ requestAnimationFrame(resizeCanvas); });
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

init();
</script>
</body>
</html>
