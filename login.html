<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;0,800;0,900;1,700&family=Barlow:wght@300;400;500;600&display=swap');

:root {
  --red: #C8102E;
  --red-dark: #9a0c22;
  --red-glow: rgba(200,16,46,0.3);
  --white: #ffffff;
  --off: #f5f5f5;
  --dark: #0d0d0d;
  --mid: #1a1a1a;
  --muted: rgba(255,255,255,0.45);
  --border: rgba(255,255,255,0.1);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }

body {
  font-family: 'Barlow', sans-serif;
  background: var(--dark);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  position: relative;
}

/* Animated background */
.bg {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: 0;
}
.bg-pitch {
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 48px,
      rgba(255,255,255,0.02) 48px,
      rgba(255,255,255,0.02) 50px
    ),
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 48px,
      rgba(255,255,255,0.02) 48px,
      rgba(255,255,255,0.02) 50px
    );
}
.bg-glow {
  position: absolute;
  width: 600px; height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(200,16,46,0.15) 0%, transparent 70%);
  top: -100px; left: 50%;
  transform: translateX(-50%);
  animation: glowPulse 4s ease-in-out infinite;
}
@keyframes glowPulse { 0%,100%{opacity:0.6;transform:translateX(-50%) scale(1);} 50%{opacity:1;transform:translateX(-50%) scale(1.1);} }

.bg-lines {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 0%, rgba(200,16,46,0.05) 50%, transparent 100%);
}

/* Login card */
.card {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 400px;
  padding: 20px;
}

.logo-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 36px;
}
.logo-img {
  height: 72px;
  width: auto;
  /* no filter needed - logo has white bg */
  margin-bottom: 16px;
  drop-shadow: 0 0 20px var(--red-glow);
}
.platform-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
  border: 1px solid var(--border);
  padding: 4px 14px;
  border-radius: 20px;
}

.login-box {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px 24px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.login-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 24px;
  font-weight: 900;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.login-sub {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 24px;
}

.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}
.form-input {
  width: 100%;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 13px 14px;
  color: var(--white);
  font-family: 'Barlow', sans-serif;
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
  -webkit-appearance: none;
  min-height: 48px;
}
.form-input::placeholder { color: rgba(255,255,255,0.2); }
.form-input:focus {
  border-color: var(--red);
  background: rgba(255,255,255,0.09);
}

.login-btn {
  width: 100%;
  min-height: 50px;
  background: var(--red);
  border: none;
  border-radius: 10px;
  color: white;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  margin-top: 8px;
  transition: background 0.2s, transform 0.1s;
  position: relative;
  overflow: hidden;
}
.login-btn:active { transform: scale(0.98); background: var(--red-dark); }
.login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.login-btn .btn-spinner {
  display: none;
  width: 18px; height: 18px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin: 0 auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 20px 0;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}
.divider span {
  font-size: 11px;
  color: var(--muted);
  font-weight: 500;
  white-space: nowrap;
}

.register-link {
  display: block;
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  cursor: pointer;
  transition: color 0.15s;
}
.register-link span { color: var(--red); font-weight: 600; }
.register-link:hover { color: var(--white); }

/* Error message */
.error-msg {
  background: rgba(200,16,46,0.15);
  border: 1px solid rgba(200,16,46,0.3);
  border-radius: 8px;
  padding: 10px 13px;
  font-size: 13px;
  color: #ff8a8a;
  margin-bottom: 14px;
  display: none;
}
.error-msg.show { display: block; }

/* Success */
.success-msg {
  background: rgba(26,122,60,0.15);
  border: 1px solid rgba(26,122,60,0.3);
  border-radius: 8px;
  padding: 10px 13px;
  font-size: 13px;
  color: #6ee89a;
  margin-bottom: 14px;
  display: none;
}
.success-msg.show { display: block; }

/* Register panel (hidden by default) */
#registerPanel { display: none; }
#loginPanel { display: block; }

/* Invite notice */
.invite-notice {
  background: rgba(200,16,46,0.12);
  border: 1px solid rgba(200,16,46,0.25);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 18px;
  font-size: 13px;
  color: rgba(255,255,255,0.8);
}
.invite-notice strong { color: var(--red); display: block; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 3px; }

/* Loading overlay */
#loadingOverlay {
  position: fixed; inset: 0;
  background: var(--dark);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 9999;
  transition: opacity 0.4s;
}
#loadingOverlay img { height: 60px; /* no filter needed - logo has white bg */ margin-bottom: 16px; }
#loadingOverlay .spin { width: 24px; height: 24px; border: 2px solid rgba(255,255,255,0.2); border-top-color: var(--red); border-radius: 50%; animation: spin 0.7s linear infinite; margin-top: 14px; }

@media (max-width: 440px) {
  .card { padding: 16px; }
  .login-box { padding: 22px 18px; }
}
</style>
</head>

<script>
// ── CONFIG — update these when Supabase project is ready ──────────────────────
const SB_URL = 'https://srmuqkkxfpgjfszlepsc.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNybXVxa2t4ZnBnamZzemxlcHNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4MzUyNTAsImV4cCI6MjA5NDQxMTI1MH0.KGKRMqROLNZNs9O_ovzlcCcGYPXzm5vex7UlkG2Df7o';
const PLATFORM_URL = 'https://dav1992-create.github.io/england-masters';

const hdrs = {
  'apikey': SB_KEY,
  'Authorization': `Bearer ${SB_KEY}`,
  'Content-Type': 'application/json'
};

// ── PANEL TOGGLE ──────────────────────────────────────────────────────────────
function showRegister() {
  document.getElementById('loginPanel').style.display = 'none';
  document.getElementById('registerPanel').style.display = 'block';
  // Check for invite param in URL
  const params = new URLSearchParams(window.location.search);
  if (params.get('invite')) {
    document.getElementById('inviteCode').value = params.get('invite');
    checkInvite();
  }
}
function showLogin() {
  document.getElementById('registerPanel').style.display = 'none';
  document.getElementById('loginPanel').style.display = 'block';
}

// ── CHECK INVITE CODE ─────────────────────────────────────────────────────────
let currentInvite = null;
async function checkInvite() {
  const code = document.getElementById('inviteCode').value.trim();
  if (code.length < 10) { document.getElementById('inviteNotice').style.display = 'none'; return; }
  try {
    const r = await fetch(`${SB_URL}/rest/v1/invites?id=eq.${code}&used=eq.false&select=*`, { headers: hdrs });
    const rows = await r.json();
    if (rows && rows[0]) {
      currentInvite = rows[0];
      const roleLabels = { head_coach: 'Head Coach', coach: 'Coaching Staff', player: 'Player' };
      document.getElementById('inviteRoleLabel').textContent = roleLabels[rows[0].role] || rows[0].role;
      if (rows[0].email) document.getElementById('regEmail').value = rows[0].email;
      document.getElementById('inviteNotice').style.display = 'block';
      document.getElementById('registerError').classList.remove('show');
    } else {
      currentInvite = null;
      document.getElementById('inviteNotice').style.display = 'none';
    }
  } catch(e) { currentInvite = null; }
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.classList.remove('show');
  if (!email || !password) { errEl.textContent = 'Please enter your email and password.'; errEl.classList.add('show'); return; }
  setLoading('login', true);
  try {
    const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { ...hdrs, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await r.json();
    if (data.access_token) {
      // Store session
      localStorage.setItem('em_session', JSON.stringify({
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        user: data.user
      }));
      // Get user role and redirect
      await redirectByRole(data.access_token, data.user.id);
    } else {
      errEl.textContent = data.error_description || 'Invalid email or password.';
      errEl.classList.add('show');
    }
  } catch(e) {
    errEl.textContent = 'Connection error — please check your internet and try again.';
    errEl.classList.add('show');
  }
  setLoading('login', false);
}

// ── REGISTER ──────────────────────────────────────────────────────────────────
async function doRegister() {
  const code = document.getElementById('inviteCode').value.trim();
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  const errEl = document.getElementById('registerError');
  const succEl = document.getElementById('registerSuccess');
  errEl.classList.remove('show');
  succEl.classList.remove('show');
  if (!currentInvite) { errEl.textContent = 'Please enter a valid invite code.'; errEl.classList.add('show'); return; }
  if (!name) { errEl.textContent = 'Please enter your full name.'; errEl.classList.add('show'); return; }
  if (!email || !password) { errEl.textContent = 'Please enter your email and a password.'; errEl.classList.add('show'); return; }
  if (password.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; errEl.classList.add('show'); return; }
  setLoading('register', true);
  try {
    // Create auth user
    const r = await fetch(`${SB_URL}/auth/v1/signup`, {
      method: 'POST',
      headers: { ...hdrs, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, data: { name } })
    });
    const data = await r.json();
    if (data.id || (data.user && data.user.id)) {
      const userId = data.id || data.user.id;
      const token = data.access_token || (data.session && data.session.access_token);
      // Create user role record
      await fetch(`${SB_URL}/rest/v1/user_roles`, {
        method: 'POST',
        headers: { ...hdrs, 'Authorization': `Bearer ${token || SB_KEY}`, 'Prefer': 'return=minimal' },
        body: JSON.stringify({ id: userId, email, name, role: currentInvite.role, player_id: currentInvite.player_id || null })
      });
      // Mark invite as used
      await fetch(`${SB_URL}/rest/v1/invites?id=eq.${code}`, {
        method: 'PATCH',
        headers: { ...hdrs, 'Prefer': 'return=minimal' },
        body: JSON.stringify({ used: true })
      });
      succEl.textContent = 'Account created! Check your email to confirm, then sign in.';
      succEl.classList.add('show');
      setTimeout(showLogin, 3000);
    } else {
      errEl.textContent = data.msg || data.error_description || 'Registration failed. This email may already be registered.';
      errEl.classList.add('show');
    }
  } catch(e) {
    errEl.textContent = 'Connection error — please try again.';
    errEl.classList.add('show');
  }
  setLoading('register', false);
}

// ── REDIRECT BY ROLE ──────────────────────────────────────────────────────────
async function redirectByRole(token, userId) {
  try {
    const r = await fetch(`${SB_URL}/rest/v1/user_roles?id=eq.${userId}&select=role`, {
      headers: { ...hdrs, 'Authorization': `Bearer ${token}` }
    });
    const rows = await r.json();
    const role = rows && rows[0] ? rows[0].role : null;
    if (role === 'head_coach' || role === 'coach') {
      window.location.href = 'dashboard.html';
    } else if (role === 'player') {
      window.location.href = 'player.html';
    } else {
      document.getElementById('loginError').textContent = 'Your account is not yet set up. Please contact your coach.';
      document.getElementById('loginError').classList.add('show');
    }
  } catch(e) {
    window.location.href = 'dashboard.html'; // fallback
  }
}

// ── LOADING STATE ─────────────────────────────────────────────────────────────
function setLoading(type, loading) {
  const btn = document.getElementById(type + 'Btn');
  const txt = document.getElementById(type + 'BtnText');
  const spin = document.getElementById(type + 'Spinner');
  btn.disabled = loading;
  txt.style.display = loading ? 'none' : 'block';
  spin.style.display = loading ? 'block' : 'none';
}

// ── ENTER KEY ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('loginPanel').style.display !== 'none') doLogin();
    else doRegister();
  }
});

// ── CHECK EXISTING SESSION ────────────────────────────────────────────────────
async function init() {
  const stored = localStorage.getItem('em_session');
  if (stored) {
    try {
      const sess = JSON.parse(stored);
      if (sess.access_token && sess.user) {
        await redirectByRole(sess.access_token, sess.user.id);
        return;
      }
    } catch(e) { localStorage.removeItem('em_session'); }
  }
  // Check for invite in URL
  const params = new URLSearchParams(window.location.search);
  if (params.get('invite')) showRegister();
  // Hide loading
  document.getElementById('loadingOverlay').style.opacity = '0';
  setTimeout(() => document.getElementById('loadingOverlay').style.display = 'none', 400);
}

init();
</script>
